name: ArchonMobile
options:
  bundleIdPrefix: com.archon
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: "15.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  ArchonMobile:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: ArchonMobile
    dependencies:
      - package: Supabase
    configFiles:
      Debug: Config/Config.xcconfig
      Release: Config/Config.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        INFOPLIST_KEY_SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        SUPPORTS_DYNAMIC_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Archon
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - archon
              - com.archonmobile.auth
  ArchonMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: ArchonMobileTests
    dependencies:
      - target: ArchonMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
